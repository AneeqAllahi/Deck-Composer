openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: DeckAI API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: brand
    description: Brand profile management
  - name: projects
    description: Project management
  - name: decks
    description: Deck management
  - name: corpus
    description: RAG corpus management
  - name: storage
    description: File upload and serving
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /brand-profile:
    get:
      operationId: getBrandProfile
      tags: [brand]
      summary: Get brand profile
      description: Returns the current brand profile configuration
      responses:
        "200":
          description: Brand profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandProfile"
    put:
      operationId: updateBrandProfile
      tags: [brand]
      summary: Update brand profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBrandProfileBody"
      responses:
        "200":
          description: Updated brand profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandProfile"
    delete:
      operationId: resetBrandProfile
      tags: [brand]
      summary: Reset brand profile to factory defaults
      responses:
        "200":
          description: Reset brand profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandProfile"

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all projects
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectBody"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a specific project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectBody"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project and its corpus documents
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted successfully
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /projects/{id}/logo:
    post:
      operationId: updateProjectLogo
      tags: [projects]
      summary: Set the logo for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                objectPath:
                  type: string
              required:
                - objectPath
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /decks:
    get:
      operationId: listDecks
      tags: [decks]
      summary: List all decks
      responses:
        "200":
          description: List of decks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeckSummary"

  /decks/generate:
    post:
      operationId: generateDeck
      tags: [decks]
      summary: Generate a new deck from a brief
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateDeckBody"
      responses:
        "201":
          description: Generated deck
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deck"

  /decks/stats:
    get:
      operationId: getDeckStats
      tags: [decks]
      summary: Get overall stats
      description: Returns total decks, corpus documents, and slides generated
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeckStats"

  /decks/{id}:
    get:
      operationId: getDeck
      tags: [decks]
      summary: Get a specific deck
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deck
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deck"
        "404":
          description: Deck not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteDeck
      tags: [decks]
      summary: Delete a deck
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted successfully

  /decks/{id}/slides/{slideIndex}:
    put:
      operationId: updateSlide
      tags: [decks]
      summary: Update a slide inline
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: slideIndex
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSlideBody"
      responses:
        "200":
          description: Updated deck
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deck"
        "404":
          description: Deck not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /decks/{id}/slides/{slideIndex}/regenerate:
    post:
      operationId: regenerateSlide
      tags: [decks]
      summary: Regenerate a single slide
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: slideIndex
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegenerateSlideBody"
      responses:
        "200":
          description: Updated deck with regenerated slide
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deck"
        "404":
          description: Deck not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /decks/{id}/export:
    get:
      operationId: exportDeck
      tags: [decks]
      summary: Export deck as PPTX
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: PPTX binary file
          content:
            application/vnd.openxmlformats-officedocument.presentationml.presentation:
              schema:
                type: string
                format: binary
        "404":
          description: Deck not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /corpus:
    get:
      operationId: listCorpusDocuments
      tags: [corpus]
      summary: List corpus documents
      parameters:
        - name: projectId
          in: query
          required: false
          schema:
            type: string
          description: Filter documents by project
      responses:
        "200":
          description: List of corpus documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CorpusDocument"

  /corpus/upload:
    post:
      operationId: uploadCorpusDocument
      tags: [corpus]
      summary: Upload a PDF or PPTX to the corpus
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                projectId:
                  type: string
                  description: Optional project to associate the document with
              required:
                - file
      responses:
        "201":
          description: Uploaded corpus document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorpusDocument"

  /corpus/{id}:
    delete:
      operationId: deleteCorpusDocument
      tags: [corpus]
      summary: Delete a corpus document
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted successfully

  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestUploadUrlBody"
      responses:
        "200":
          description: Presigned URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestUploadUrlResponse"

  /storage/objects/{objectPath}:
    get:
      operationId: getStorageObject
      tags: [storage]
      summary: Serve a stored object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    BrandProfile:
      type: object
      properties:
        id:
          type: string
        primaryColor:
          type: string
          description: Hex color code e.g. #1a2b3c
        secondaryColor:
          type: string
        accentColor:
          type: string
        headingFont:
          type: string
        bodyFont:
          type: string
        logoObjectPath:
          type: string
          nullable: true
        density:
          type: string
          enum: [spacious, balanced, dense]
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - primaryColor
        - secondaryColor
        - accentColor
        - headingFont
        - bodyFont
        - density
        - updatedAt

    UpdateBrandProfileBody:
      type: object
      properties:
        primaryColor:
          type: string
        secondaryColor:
          type: string
        accentColor:
          type: string
        headingFont:
          type: string
        bodyFont:
          type: string
        logoObjectPath:
          type: string
          nullable: true
        density:
          type: string
          enum: [spacious, balanced, dense]

    Project:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        primaryColor:
          type: string
        secondaryColor:
          type: string
        accentColor:
          type: string
        headingFont:
          type: string
        bodyFont:
          type: string
        logoObjectPath:
          type: string
          nullable: true
        density:
          type: string
          enum: [spacious, balanced, dense]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - description
        - primaryColor
        - secondaryColor
        - accentColor
        - headingFont
        - bodyFont
        - density
        - createdAt
        - updatedAt

    CreateProjectBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        primaryColor:
          type: string
        secondaryColor:
          type: string
        accentColor:
          type: string
        headingFont:
          type: string
        bodyFont:
          type: string
        density:
          type: string
          enum: [spacious, balanced, dense]
      required:
        - name

    UpdateProjectBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        primaryColor:
          type: string
        secondaryColor:
          type: string
        accentColor:
          type: string
        headingFont:
          type: string
        bodyFont:
          type: string
        logoObjectPath:
          type: string
          nullable: true
        density:
          type: string
          enum: [spacious, balanced, dense]

    SlideOutline:
      type: object
      properties:
        slideIndex:
          type: integer
          description: 0-based slide index
        guidance:
          type: string
          description: Specific instructions for this slide
      required:
        - slideIndex
        - guidance

    Slide:
      type: object
      properties:
        slideIndex:
          type: integer
        title:
          type: string
        body:
          type: string
          description: Markdown body content
        layoutType:
          type: string
          enum: [title, section, text, columns, quote, metrics]
        speakerNotes:
          type: string
        bulletPoints:
          type: array
          items:
            type: string
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/SlideMetric"
        columnLeft:
          type: string
          nullable: true
        columnRight:
          type: string
          nullable: true
      required:
        - slideIndex
        - title
        - body
        - layoutType
        - speakerNotes

    SlideMetric:
      type: object
      properties:
        value:
          type: string
        label:
          type: string
      required:
        - value
        - label

    Deck:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        brief:
          type: string
        audience:
          type: string
        narrativeStructure:
          type: string
          enum: [problem-solution, consulting, chronological, mece-pyramid, executive-summary, custom]
        slides:
          type: array
          items:
            $ref: "#/components/schemas/Slide"
        projectId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - brief
        - audience
        - narrativeStructure
        - slides
        - createdAt
        - updatedAt

    DeckSummary:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        brief:
          type: string
        slideCount:
          type: integer
        projectId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - brief
        - slideCount
        - createdAt

    GenerateDeckBody:
      type: object
      properties:
        title:
          type: string
        brief:
          type: string
        audience:
          type: string
        slideCount:
          type: integer
          minimum: 3
          maximum: 30
        narrativeStructure:
          type: string
          enum: [problem-solution, consulting, chronological, mece-pyramid, executive-summary, custom]
        projectId:
          type: string
          nullable: true
          description: Optional project to use for branding and corpus scoping
        slideOutlines:
          type: array
          items:
            $ref: "#/components/schemas/SlideOutline"
          description: Optional per-slide guidance for slide-by-slide mode
      required:
        - title
        - brief
        - audience
        - slideCount
        - narrativeStructure

    UpdateSlideBody:
      type: object
      properties:
        title:
          type: string
        body:
          type: string
        bulletPoints:
          type: array
          items:
            type: string
        speakerNotes:
          type: string
        layoutType:
          type: string
          enum: [title, section, text, columns, quote, metrics]
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/SlideMetric"
        columnLeft:
          type: string
          nullable: true
        columnRight:
          type: string
          nullable: true

    RegenerateSlideBody:
      type: object
      properties:
        instruction:
          type: string
          description: Optional instruction for how to regenerate the slide

    DeckStats:
      type: object
      properties:
        totalDecks:
          type: integer
        totalCorpusDocuments:
          type: integer
        totalSlidesGenerated:
          type: integer
        totalChunks:
          type: integer
      required:
        - totalDecks
        - totalCorpusDocuments
        - totalSlidesGenerated
        - totalChunks

    CorpusDocument:
      type: object
      properties:
        id:
          type: string
        filename:
          type: string
        fileType:
          type: string
          enum: [pdf, pptx]
        chunkCount:
          type: integer
        status:
          type: string
          enum: [processing, ready, error]
        projectId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - filename
        - fileType
        - chunkCount
        - status
        - createdAt

    RequestUploadUrlBody:
      type: object
      properties:
        name:
          type: string
        size:
          type: integer
        contentType:
          type: string
      required:
        - name
        - size
        - contentType

    RequestUploadUrlResponse:
      type: object
      properties:
        uploadURL:
          type: string
        objectPath:
          type: string
      required:
        - uploadURL
        - objectPath
